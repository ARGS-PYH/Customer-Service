name: Prepare tested dependency lockfile
on:
  push:
    branches:
      - audit/dependency-check-2026-11-01
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dependency-check-2026-11-01
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and update safe dependencies
        run: |
          npm ci
          npm audit fix || true
          npm run build
          npm audit --json > audit.json || true
          node -e "const r=require('./audit.json'); console.log('FINAL AUDIT', JSON.stringify(r.metadata?.vulnerabilities ?? {}))"
      - name: Save tested lockfile to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update safe dependency versions"
            git push origin HEAD:audit/dependency-check-2026-11-01
          else
            echo "No lockfile changes to save"
          fi

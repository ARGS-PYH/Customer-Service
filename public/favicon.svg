<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Color Gradients matching Damilare's Portfolio theme -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Outer Glow Filter for depth and premium glow aesthetics -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular glassmorphic background container -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="url(#primary-grad)" stroke-width="12" />
  
  <!-- Subtle circular grid for a technical, systems-oriented look -->
  <g opacity="0.08">
    <circle cx="256" cy="256" r="220" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="8 8" />
    <circle cx="256" cy="256" r="180" fill="none" stroke="#fff" stroke-width="1" />
    <line x1="256" y1="36" x2="256" y2="476" stroke="#fff" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="36" y1="256" x2="476" y2="256" stroke="#fff" stroke-width="2" stroke-dasharray="4 4" />
  </g>

  <!-- Stylized Monogram "DA" -->
  <g>
    <!-- Underlay node structures representing computer science (ALX, Data Analytics) -->
    <g opacity="0.3" stroke="url(#primary-grad)" stroke-width="4" fill="none" filter="url(#glow)">
      <path d="M 120 180 L 190 120 L 322 120 L 392 180 M 120 332 L 190 392 L 322 392 L 392 332" />
      <circle cx="120" cy="180" r="8" fill="#06b6d4" />
      <circle cx="190" cy="120" r="8" fill="#8b5cf6" />
      <circle cx="322" cy="120" r="8" fill="#8b5cf6" />
      <circle cx="392" cy="180" r="8" fill="#06b6d4" />
      <circle cx="120" cy="332" r="8" fill="#06b6d4" />
      <circle cx="190" cy="392" r="8" fill="#8b5cf6" />
      <circle cx="322" cy="392" r="8" fill="#8b5cf6" />
      <circle cx="392" cy="332" r="8" fill="#06b6d4" />
    </g>

    <!-- 'D' Letter Geometry: Tech/Data precision, clean & robust curve -->
    <path d="M 140 140 L 220 140 C 290 140 330 180 330 256 C 330 332 290 372 220 372 L 140 372 Z" 
          fill="none" 
          stroke="url(#primary-grad)" 
          stroke-width="32" 
          stroke-linejoin="round" 
          stroke-linecap="round"
          filter="url(#glow)" />
          
    <!-- Inner D Accent: Representing active communication, client feedback, and support loops -->
    <path d="M 190 190 L 220 190 C 255 190 275 210 275 256 C 275 302 255 322 220 322 L 190 322" 
          fill="none" 
          stroke="url(#accent-grad)" 
          stroke-width="12" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- 'A' Letter Geometry: Ascending chevron shape representing operations growth and success -->
    <path d="M 260 372 L 320 160 C 325 145 335 140 350 140 C 365 140 375 145 380 160 L 440 372" 
          fill="none" 
          stroke="url(#accent-grad)" 
          stroke-width="28" 
          stroke-linejoin="round" 
          stroke-linecap="round"
          filter="url(#glow)" />
          
    <!-- Connecting Bridge: Representing the bridge between tech systems and operations/customers -->
    <path d="M 295 295 L 405 295" 
          fill="none" 
          stroke="url(#primary-grad)" 
          stroke-width="16" 
          stroke-linecap="round" />
  </g>

  <!-- Glowing bright core representing user satisfaction and detail focus -->
  <circle cx="350" cy="295" r="16" fill="#fff" filter="url(#glow)" opacity="0.95" />
  <circle cx="350" cy="295" r="8" fill="#06b6d4" />
</svg>